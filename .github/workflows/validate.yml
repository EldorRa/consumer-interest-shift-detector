# Keeps three real invariants, cheaply. It deliberately does not install
# BERTopic: a CI run that cannot execute the analysis should not pretend to.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools only
        run: pip install nbformat jupytext

      - name: Notebook is well-formed
        run: python scripts/validate_notebook.py

      - name: Script export is in step with the notebook
        run: |
          jupytext --to py:percent --output /tmp/regenerated.py notebooks/consumer_interest_pipeline.ipynb
          python scripts/check_export.py notebooks/consumer_interest_pipeline.py /tmp/regenerated.py

      - name: Excluded files are not committed
        run: |
          for f in Olympics_Tokyo_tweets.csv outputs/coding_sheet.csv; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "ERROR: $f must not be committed"
              exit 1
            fi
          done
          echo "exclusions ok"
